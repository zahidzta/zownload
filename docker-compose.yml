services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: zownload-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DOWNLOADS_DIR=/app/downloads
    volumes:
      - downloads:/app/downloads
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: zownload-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  downloads: